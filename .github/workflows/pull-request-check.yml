name: Pull Request Check
on:
  pull_request:
  branches:
    - main
    - dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript compiler
        run: yarn tsc --noEmit

      - name: Run tests
        run: npm test
