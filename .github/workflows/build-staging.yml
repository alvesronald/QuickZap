name: Build Staging (Android)

env:
  APK_OUTPUT_PATH: android/app/build/outputs/apk/release/app-release.apk

on:
  workflow_dispatch:

jobs:
  run-checks:
    uses: ./.github/workflows/pull-request-check.yml

  build-android:
    needs: run-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ./android

    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        working-directory: ./
        run: npm install

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_QUICKZAP_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/my-upload-key.keystore
          echo "Verifying keystore:"
          keytool -list -keystore app/my-upload-key.keystore -storepass "$STORE_PASS"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Android App
        run: ./gradlew assembleRelease
        env:
          QUICKZAP_STORE_PASSWORD: ${{ secrets.ANDROID_QUICKZAP_STORE_PASSWORD }}
          QUICKZAP_KEY_ALIAS: ${{ secrets.ANDROID_QUICKZAP_KEY_ALIAS }}
          QUICKZAP_KEY_PASSWORD: ${{ secrets.ANDROID_QUICKZAP_KEY_PASSWORD }}

      - name: Upload APK to Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: ${{ env.APK_OUTPUT_PATH }}
          retention-days: 7
